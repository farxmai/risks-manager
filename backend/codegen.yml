overwrite: true
schema: "./src/schema.graphql"
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-resolvers"
    config:
      useIndexSignature: true
      contextType: "../context#GraphQLContext"
      mappers:
        Category: "../models/Category#CategoryDocument"
        Risk: "../models/Risk#RiskDocument"
